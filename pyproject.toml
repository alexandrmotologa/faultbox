[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faultbox"
version = "0.1.0"
description = "Programmable network and protocol chaos injection proxy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexandr Motologa", email = "alexandr@motologa.com" }
]
keywords = ["chaos-engineering", "proxy", "network", "testing", "resilience", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "coverage>=7.4.0",
]

[project.scripts]
faultbox = "faultbox.cli:app"

[project.entry-points.pytest11]
faultbox = "faultbox.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/faultbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
